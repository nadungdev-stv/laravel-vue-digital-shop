<?xml version="1.0" encoding="UTF-8"?>
<svg width="1070" height="500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 500">
    <defs>
        <linearGradient id="grad6" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#a8edea;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#fed6e3;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow6">
            <feDropShadow dx="0" dy="3" stdDeviation="8" flood-opacity="0.3"/>
        </filter>
        <pattern id="dots6" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
            <circle cx="20" cy="20" r="2" fill="#ffffff" opacity="0.1"/>
        </pattern>
    </defs>

    <!-- Background with gradient -->
    <rect width="1070" height="500" fill="url(#grad6)"/>

    <!-- Dot pattern overlay -->
    <rect width="1070" height="500" fill="url(#dots6)"/>

    <!-- Icon/Text -->
    <g filter="url(#shadow6)">
        <!-- Large letter -->
        <text
            x="50%"
            y="42%"
            font-family="Arial, sans-serif"
            font-size="225"
            font-weight="bold"
            fill="#ffffff"
            text-anchor="middle"
            dominant-baseline="middle"
            opacity="0.95">
            N
        </text>

        <!-- Product name -->
        <text
            x="50%"
            y="72%"
            font-family="Arial, sans-serif"
            font-size="60"
            font-weight="600"
            fill="#ffffff"
            text-anchor="middle"
            dominant-baseline="middle"
            opacity="0.9">
            NordVPN 6 Tháng
        </text>
    </g>

    <!-- Decorative circles -->
    <circle cx="820" cy="80" r="64" fill="#ffffff" opacity="0.15"/>
    <circle cx="100" cy="420" r="42" fill="#ffffff" opacity="0.1"/>
    <circle cx="780" cy="380" r="42" fill="#ffffff" opacity="0.08"/>
</svg>