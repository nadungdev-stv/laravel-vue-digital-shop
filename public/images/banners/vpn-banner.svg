<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#134e5e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#71b280;stop-opacity:1" />
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#grad2)"/>

  <!-- Decorative elements -->
  <circle cx="150" cy="100" r="60" fill="rgba(255,255,255,0.08)"/>
  <circle cx="1050" cy="300" r="90" fill="rgba(255,255,255,0.08)"/>
  <circle cx="900" cy="100" r="70" fill="rgba(255,255,255,0.1)"/>

  <!-- Shield icon -->
  <g transform="translate(120, 80)">
    <path d="M 80 20 L 20 50 L 20 130 Q 20 160 50 180 Q 80 200 80 200 Q 80 200 110 180 Q 140 160 140 130 L 140 50 Z"
          fill="white" opacity="0.9" filter="url(#glow2)"/>
    <path d="M 80 50 L 50 70 L 50 130 Q 50 145 65 155 Q 80 165 80 165 Q 80 165 95 155 Q 110 145 110 130 L 110 70 Z"
          fill="#134e5e"/>
    <path d="M 70 115 L 75 120 L 90 100" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Lock icon -->
  <g transform="translate(920, 100)">
    <rect x="30" y="50" width="80" height="90" rx="10" fill="white" opacity="0.9"/>
    <rect x="45" y="65" width="50" height="60" rx="5" fill="#71b280"/>
    <path d="M 50 50 Q 50 20 70 20 Q 90 20 90 50" fill="none" stroke="white" stroke-width="8" opacity="0.9"/>
    <circle cx="70" cy="95" r="8" fill="white"/>
    <rect x="67" y="95" width="6" height="20" fill="white" rx="3"/>
  </g>

  <!-- Text content -->
  <text x="350" y="140" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="white" filter="url(#glow2)">
    VPN Bảo Mật
  </text>
  <text x="350" y="210" font-family="Arial, sans-serif" font-size="32" fill="rgba(255,255,255,0.95)">
    Ứng dụng VPN tốc độ cao - Bảo mật tối đa
  </text>
  <text x="350" y="260" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.85)">
    ✓ Mã hóa AES-256   ✓ No-log policy   ✓ 50+ servers toàn cầu
  </text>

  <!-- CTA Button -->
  <g transform="translate(350, 280)">
    <rect x="0" y="0" width="220" height="50" rx="25" fill="white"/>
    <text x="110" y="33" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#134e5e" text-anchor="middle">
      Dùng thử miễn phí →
    </text>
  </g>
</svg>
