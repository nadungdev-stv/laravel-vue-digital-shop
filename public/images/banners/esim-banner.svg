<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#grad1)"/>

  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="80" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1100" cy="300" r="100" fill="rgba(255,255,255,0.1)"/>
  <circle cx="950" cy="80" r="50" fill="rgba(255,255,255,0.15)"/>

  <!-- SIM card icon -->
  <g transform="translate(150, 100)">
    <rect x="0" y="0" width="120" height="160" rx="10" fill="white" opacity="0.9"/>
    <rect x="15" y="15" width="90" height="70" rx="5" fill="#667eea"/>
    <rect x="25" y="25" width="20" height="15" fill="white" rx="2"/>
    <rect x="50" y="25" width="20" height="15" fill="white" rx="2"/>
    <rect x="75" y="25" width="20" height="15" fill="white" rx="2"/>
    <rect x="25" y="45" width="20" height="15" fill="white" rx="2"/>
    <rect x="50" y="45" width="20" height="15" fill="white" rx="2"/>
    <rect x="75" y="45" width="20" height="15" fill="white" rx="2"/>
    <rect x="25" y="65" width="20" height="15" fill="white" rx="2"/>
    <rect x="50" y="65" width="20" height="15" fill="white" rx="2"/>
    <rect x="75" y="65" width="20" height="15" fill="white" rx="2"/>
  </g>

  <!-- Globe icon -->
  <g transform="translate(900, 120)">
    <circle cx="60" cy="60" r="55" fill="none" stroke="white" stroke-width="3" opacity="0.8"/>
    <ellipse cx="60" cy="60" rx="25" ry="55" fill="none" stroke="white" stroke-width="2" opacity="0.8"/>
    <ellipse cx="60" cy="60" rx="55" ry="25" fill="none" stroke="white" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Text content -->
  <text x="400" y="150" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="white" filter="url(#glow)">
    eSIM Du Lịch
  </text>
  <text x="400" y="220" font-family="Arial, sans-serif" font-size="32" fill="rgba(255,255,255,0.95)">
    Kết nối mọi nơi - Không cần thay SIM
  </text>
  <text x="400" y="270" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.85)">
    ✓ Kích hoạt ngay lập tức   ✓ Hơn 190 quốc gia   ✓ Data không giới hạn
  </text>

  <!-- CTA Button -->
  <g transform="translate(400, 290)">
    <rect x="0" y="0" width="200" height="50" rx="25" fill="white"/>
    <text x="100" y="33" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#667eea" text-anchor="middle">
      Mua ngay →
    </text>
  </g>
</svg>
