<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f77f00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fcbf49;stop-opacity:1" />
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#grad3)"/>

  <!-- Decorative elements -->
  <circle cx="100" cy="80" r="50" fill="rgba(247,127,0,0.15)"/>
  <circle cx="1100" cy="320" r="80" fill="rgba(247,127,0,0.15)"/>
  <circle cx="950" cy="100" r="60" fill="rgba(252,191,73,0.1)"/>

  <!-- Game controller icon -->
  <g transform="translate(100, 100)">
    <ellipse cx="80" cy="80" rx="100" ry="60" fill="url(#orangeGrad)" opacity="0.95" filter="url(#glow3)"/>
    <!-- D-pad -->
    <rect x="35" y="70" width="10" height="30" rx="2" fill="#1a1a2e"/>
    <rect x="30" y="75" width="20" height="10" rx="2" fill="#1a1a2e"/>
    <!-- Buttons -->
    <circle cx="120" cy="70" r="8" fill="#1a1a2e"/>
    <circle cx="135" cy="85" r="8" fill="#1a1a2e"/>
    <circle cx="105" cy="85" r="8" fill="#1a1a2e"/>
    <circle cx="120" cy="100" r="8" fill="#1a1a2e"/>
  </g>

  <!-- Trophy icon -->
  <g transform="translate(920, 100)">
    <path d="M 60 30 L 40 30 L 40 50 Q 40 65 50 70 L 50 85 L 45 85 L 45 95 L 75 95 L 75 85 L 70 85 L 70 70 Q 80 65 80 50 L 80 30 L 60 30 Z"
          fill="url(#orangeGrad)" opacity="0.95" filter="url(#glow3)"/>
    <path d="M 40 30 L 30 30 Q 20 30 20 45 Q 20 55 30 55 L 40 55" fill="none" stroke="url(#orangeGrad)" stroke-width="3" opacity="0.9"/>
    <path d="M 80 30 L 90 30 Q 100 30 100 45 Q 100 55 90 55 L 80 55" fill="none" stroke="url(#orangeGrad)" stroke-width="3" opacity="0.9"/>
  </g>

  <!-- Text content -->
  <text x="370" y="140" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="url(#orangeGrad)" filter="url(#glow3)">
    Game Steam
  </text>
  <text x="370" y="210" font-family="Arial, sans-serif" font-size="32" fill="rgba(255,255,255,0.95)">
    Tài khoản offline - Game bom tấn AAA
  </text>
  <text x="370" y="260" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.85)">
    ✓ 100+ games   ✓ Bảo hành 6 tháng   ✓ Đổi pass free
  </text>

  <!-- CTA Button -->
  <g transform="translate(370, 280)">
    <rect x="0" y="0" width="200" height="50" rx="25" fill="url(#orangeGrad)"/>
    <text x="100" y="33" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1a1a2e" text-anchor="middle">
      Xem ngay →
    </text>
  </g>

  <!-- Game icons decoration -->
  <g transform="translate(850, 250)" opacity="0.3">
    <circle cx="0" cy="0" r="15" fill="#f77f00"/>
    <circle cx="35" cy="0" r="15" fill="#fcbf49"/>
    <circle cx="70" cy="0" r="15" fill="#f77f00"/>
  </g>
</svg>
