<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="#f8f9fa"/>

  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d6efd;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#0dcaf0;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <rect width="300" height="200" fill="url(#grad)"/>

  <!-- Icon -->
  <g transform="translate(150, 70)">
    <!-- Shopping bag icon -->
    <path d="M -20 0 L -20 35 L 20 35 L 20 0 M -15 0 L -15 -8 Q -15 -15 -8 -15 L 8 -15 Q 15 -15 15 -8 L 15 0"
          stroke="#6c757d"
          stroke-width="2"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Text -->
  <text x="150" y="130" font-family="Arial, sans-serif" font-size="14" fill="#6c757d" text-anchor="middle" font-weight="500">
    Chưa có hình ảnh
  </text>

  <text x="150" y="150" font-family="Arial, sans-serif" font-size="11" fill="#adb5bd" text-anchor="middle">
    Sản phẩm
  </text>
</svg>
